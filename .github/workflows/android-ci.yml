name: Android CI (Unit Tests & Adaptation Tests)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm chạy thủ công từ giao diện GitHub Actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: UNIT TESTS & CODE VERIFICATION (Nhanh, phản hồi trong 2-3 phút)
  # =========================================================================
  unit-tests:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Set up Gradle & Dependency Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🔑 Provide Mock Google Services & local.properties (if not set in Secrets)
        run: |
          mkdir -p app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            echo "Loaded real google-services.json from GitHub Secrets"
          elif [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "moneymanager-dummy",
              "storage_bucket": "moneymanager-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                  "android_client_info": {
                    "package_name": "pose.moneymanager"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key_for_ci_build"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "Generated mock google-services.json for CI build"
          fi
          
          # Create dummy local.properties for API keys if missing
          touch local.properties
          echo "apiKey=dummy_api_key" >> local.properties
          echo "geminiApiKey=dummy_gemini_key" >> local.properties

      - name: 🔨 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🚀 Run Unit Tests (JVM)
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: 📊 Publish Test Report Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: app/build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: 📦 Upload Test HTML Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # =========================================================================
  # JOB 2: ADAPTATION & INSTRUMENTED TESTS (Chạy trên Android Emulator)
  # =========================================================================
  adaptation-tests:
    name: 📱 Run Device Adaptation Tests (Emulator)
    # Chạy khi có PR vào main hoặc khi kích hoạt thủ công (workflow_dispatch)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: [ unit-tests ]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔑 Provide Mock Google Services & local.properties
        run: |
          mkdir -p app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "moneymanager-dummy",
              "storage_bucket": "moneymanager-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                  "android_client_info": {
                    "package_name": "pose.moneymanager"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_key" }],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          touch local.properties
          echo "apiKey=dummy_api_key" >> local.properties
          echo "geminiApiKey=dummy_gemini_key" >> local.properties

      - name: 🔨 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ⚡ Enable KVM (Hardware Acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🎮 Run Adaptation & Instrumented Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --continue

      - name: 📊 Upload AndroidTest HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptation-test-report
          path: app/build/reports/androidTests/connected/
          retention-days: 7
